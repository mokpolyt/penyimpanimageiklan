<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image / CTR / Result Tracker</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px;
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #111;
  }

  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    column-gap: 70px;
    row-gap: 80px;
  }

  .column {
    text-align: center;
  }

  .heading {
    color: #12afe0;
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 22px;
  }

  .number {
    font-size: 42px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 8px;
    min-height: 42px;
  }

  .image-box {
    width: 190px;
    height: 130px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border-radius: 8px;
    background: #f4f4f4;
  }

  .image-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
  }

  .placeholder {
    color: #aaa;
    font-size: 15px;
  }

  button {
    border: 0;
    border-radius: 40px;
    background: #8e1518;
    color: #12afe0;
    font-size: 25px;
    font-weight: 700;
    padding: 12px 28px;
    cursor: pointer;
  }

  button:hover {
    opacity: .88;
  }

  input[type="file"] {
    display: none;
  }

  .edit-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .edit-row .number {
    cursor: pointer;
  }

  .status {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    padding: 10px 18px;
    border-radius: 20px;
    background: #111;
    color: white;
    font-size: 14px;
    opacity: 0;
    transition: opacity .2s;
    pointer-events: none;
  }

  .status.show { opacity: 1; }

  @media (max-width: 750px) {
    body { padding: 25px 15px; }

    .grid {
      grid-template-columns: 1fr;
      row-gap: 60px;
    }
  }
</style>
</head>

<body>

<div class="grid">

  <!-- ROW 1 -->
  <div class="column">
    <div class="heading">gambar</div>

    <div class="image-box">
      <img id="image1" alt="Uploaded image 1">
      <span id="placeholder1" class="placeholder">No image</span>
    </div>

    <input id="file1" type="file" accept="image/*"
           onchange="uploadImage(1, this.files[0])">
    <button onclick="document.getElementById('file1').click()">
      browse
    </button>
  </div>

  <div class="column">
    <div class="heading">ctr</div>

    <div class="edit-row">
      <div id="ctr1" class="number">1,2</div>
      <button onclick="editNumber('ctr1')">edit</button>
    </div>
  </div>

  <div class="column">
    <div class="heading">hasil</div>

    <div class="edit-row">
      <div id="result1" class="number">1,2</div>
      <button onclick="editNumber('result1')">edit</button>
    </div>
  </div>


  <!-- ROW 2 -->
  <div class="column">
    <div class="image-box">
      <img id="image2" alt="Uploaded image 2">
      <span id="placeholder2" class="placeholder">No image</span>
    </div>

    <input id="file2" type="file" accept="image/*"
           onchange="uploadImage(2, this.files[0])">
    <button onclick="document.getElementById('file2').click()">
      browse
    </button>
  </div>

  <div class="column">
    <div class="edit-row">
      <div id="ctr2" class="number">1,2</div>
      <button onclick="editNumber('ctr2')">edit</button>
    </div>
  </div>

  <div class="column">
    <div class="edit-row">
      <div id="result2" class="number">1,2</div>
      <button onclick="editNumber('result2')">edit</button>
    </div>
  </div>


  <!-- ROW 3 -->
  <div class="column">
    <div class="image-box">
      <img id="image3" alt="Uploaded image 3">
      <span id="placeholder3" class="placeholder">No image</span>
    </div>

    <input id="file3" type="file" accept="image/*"
           onchange="uploadImage(3, this.files[0])">
    <button onclick="document.getElementById('file3').click()">
      browse
    </button>
  </div>

  <div class="column">
    <div class="edit-row">
      <div id="ctr3" class="number">1,2</div>
      <button onclick="editNumber('ctr3')">edit</button>
    </div>
  </div>

  <div class="column">
    <div class="edit-row">
      <div id="result3" class="number">1,2</div>
      <button onclick="editNumber('result3')">edit</button>
    </div>
  </div>

</div>

<div id="status" class="status"></div>

<script>
/*
==========================================================
CLOUDINARY SETUP
==========================================================

1. Create a free Cloudinary account:
   https://cloudinary.com/

2. Go to:
   Settings -> Upload -> Upload presets

3. Create an UNSIGNED upload preset.

4. Put your values below.
==========================================================
*/

const CLOUDINARY_CLOUD_NAME = "a0v4uibq";
const CLOUDINARY_UPLOAD_PRESET = "yuhabach";

const STORAGE_KEY = "imageCtrResultTracker";

let savedData = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");


function showStatus(message) {
  const status = document.getElementById("status");
  status.textContent = message;
  status.classList.add("show");

  setTimeout(() => {
    status.classList.remove("show");
  }, 2500);
}


/*
Load saved URLs and numbers when the page opens.
The actual image files live permanently on Cloudinary;
the URL is saved locally so the page remembers them.
*/
function loadSavedData() {

  for (let i = 1; i <= 3; i++) {

    // Load image
    if (savedData["image" + i]) {
      showImage(i, savedData["image" + i]);
    }

    // Load CTR
    if (savedData["ctr" + i] !== undefined) {
      document.getElementById("ctr" + i).textContent =
        savedData["ctr" + i];
    }

    // Load result
    if (savedData["result" + i] !== undefined) {
      document.getElementById("result" + i).textContent =
        savedData["result" + i];
    }
  }
}


function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(savedData));
}


/*
Upload selected image directly from browser -> Cloudinary.
No image is uploaded to your own server.
*/
async function uploadImage(row, file) {

  if (!file) return;

  if (
    CLOUDINARY_CLOUD_NAME === "YOUR_CLOUD_NAME" ||
    CLOUDINARY_UPLOAD_PRESET === "YOUR_UNSIGNED_UPLOAD_PRESET"
  ) {
    alert(
      "First put your Cloudinary Cloud Name and Unsigned Upload Preset in the HTML code."
    );
    return;
  }

  showStatus("Uploading image...");

  const formData = new FormData();

  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  try {

    const response = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
      {
        method: "POST",
        body: formData
      }
    );

    if (!response.ok) {
      throw new Error("Upload failed");
    }

    const data = await response.json();

    /*
      This is the permanent Cloudinary URL.
      Example:
      https://res.cloudinary.com/xxx/image/upload/xxxxx.jpg
    */
    const imageUrl = data.secure_url;

    savedData["image" + row] = imageUrl;

    saveData();

    showImage(row, imageUrl);

    showStatus("Image uploaded successfully.");

    console.log("Cloudinary image URL:", imageUrl);

  } catch (error) {

    console.error(error);

    showStatus("Upload failed.");

    alert(
      "Upload failed. Check your Cloudinary Cloud Name, Upload Preset, and browser console."
    );
  }
}


function showImage(row, imageUrl) {

  const img = document.getElementById("image" + row);
  const placeholder = document.getElementById("placeholder" + row);

  img.src = imageUrl;
  img.style.display = "block";
  placeholder.style.display = "none";
}


/*
Edit CTR or result.
Clicking EDIT opens a small prompt.
*/
function editNumber(id) {

  const currentValue =
    document.getElementById(id).textContent;

  const newValue = prompt(
    "Enter new value:",
    currentValue
  );

  if (newValue === null) return;

  const cleanValue = newValue.trim();

  if (cleanValue === "") return;

  document.getElementById(id).textContent = cleanValue;

  savedData[id] = cleanValue;

  saveData();
}


// Start
loadSavedData();

</script>

</body>
</html>
