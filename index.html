<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Image / CTR / Result Tracker</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 40px;

  font-family: Arial, Helvetica, sans-serif;

  background: #fff;

  color: #111;

}


.grid {

  max-width: 900px;

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    1fr 1fr 1fr;

  column-gap: 70px;

  row-gap: 80px;

}


.column {

  text-align: center;

}


.heading {

  color: #12afe0;

  font-size: 30px;

  font-weight: 700;

  margin-bottom: 22px;

}


.number {

  font-size: 42px;

  font-weight: 700;

  line-height: 1;

  margin-bottom: 8px;

  min-height: 42px;

}


.image-box {

  width: 190px;

  height: 130px;

  margin: 0 auto 12px;

  display: flex;

  align-items: center;

  justify-content: center;

  overflow: hidden;

  border-radius: 8px;

  background: #f4f4f4;

}


.image-box img {

  width: 100%;

  height: 100%;

  object-fit: contain;

  display: none;

}


.placeholder {

  color: #aaa;

  font-size: 15px;

}


button {

  border: 0;

  border-radius: 40px;

  background: #8e1518;

  color: #12afe0;

  font-size: 25px;

  font-weight: 700;

  padding: 12px 28px;

  cursor: pointer;

}


button:hover {

  opacity: .88;

}


button:disabled {

  opacity: .5;

  cursor: wait;

}


input[type="file"] {

  display: none;

}


.edit-row {

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 8px;

}


.edit-row .number {

  cursor: pointer;

}


.status {

  position: fixed;

  left: 50%;

  bottom: 20px;

  transform: translateX(-50%);

  padding: 10px 18px;

  border-radius: 20px;

  background: #111;

  color: white;

  font-size: 14px;

  opacity: 0;

  transition: opacity .2s;

  pointer-events: none;

}


.status.show {

  opacity: 1;

}


@media (max-width: 750px) {

  body {

    padding: 25px 15px;

  }


  .grid {

    grid-template-columns: 1fr;

    row-gap: 60px;

  }

}

</style>

</head>


<body>


<div class="grid">


  <!-- ============================= -->
  <!-- ROW 1 -->
  <!-- ============================= -->

  <div class="column">

    <div class="heading">
      gambar
    </div>


    <div class="image-box">

      <img id="image1"
           alt="Uploaded image 1">

      <span id="placeholder1"
            class="placeholder">

        No image

      </span>

    </div>


    <input
      id="file1"
      type="file"
      accept="image/*"
      onchange="uploadImage(1, this.files[0])"
    >


    <button
      id="browse1"
      onclick="document.getElementById('file1').click()">

      browse

    </button>

  </div>



  <div class="column">

    <div class="heading">
      ctr
    </div>


    <div class="edit-row">

      <div id="ctr1"
           class="number">

        1,2

      </div>


      <button
        onclick="editNumber('ctr1')">

        edit

      </button>

    </div>

  </div>



  <div class="column">

    <div class="heading">
      hasil
    </div>


    <div class="edit-row">

      <div id="result1"
           class="number">

        1,2

      </div>


      <button
        onclick="editNumber('result1')">

        edit

      </button>

    </div>

  </div>



  <!-- ============================= -->
  <!-- ROW 2 -->
  <!-- ============================= -->

  <div class="column">

    <div class="image-box">

      <img id="image2"
           alt="Uploaded image 2">

      <span id="placeholder2"
            class="placeholder">

        No image

      </span>

    </div>


    <input
      id="file2"
      type="file"
      accept="image/*"
      onchange="uploadImage(2, this.files[0])"
    >


    <button
      id="browse2"
      onclick="document.getElementById('file2').click()">

      browse

    </button>

  </div>



  <div class="column">

    <div class="edit-row">

      <div id="ctr2"
           class="number">

        1,2

      </div>


      <button
        onclick="editNumber('ctr2')">

        edit

      </button>

    </div>

  </div>



  <div class="column">

    <div class="edit-row">

      <div id="result2"
           class="number">

        1,2

      </div>


      <button
        onclick="editNumber('result2')">

        edit

      </button>

    </div>

  </div>



  <!-- ============================= -->
  <!-- ROW 3 -->
  <!-- ============================= -->

  <div class="column">

    <div class="image-box">

      <img id="image3"
           alt="Uploaded image 3">

      <span id="placeholder3"
            class="placeholder">

        No image

      </span>

    </div>


    <input
      id="file3"
      type="file"
      accept="image/*"
      onchange="uploadImage(3, this.files[0])"
    >


    <button
      id="browse3"
      onclick="document.getElementById('file3').click()">

      browse

    </button>

  </div>



  <div class="column">

    <div class="edit-row">

      <div id="ctr3"
           class="number">

        1,2

      </div>


      <button
        onclick="editNumber('ctr3')">

        edit

      </button>

    </div>

  </div>



  <div class="column">

    <div class="edit-row">

      <div id="result3"
           class="number">

        1,2

      </div>


      <button
        onclick="editNumber('result3')">

        edit

      </button>

    </div>

  </div>


</div>


<div id="status"
     class="status">

</div>



<!-- ========================================= -->
<!-- SUPABASE -->
<!-- ========================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/*
========================================================
SUPABASE CONFIGURATION
========================================================

Replace these two values with your own.

Supabase Dashboard
→ Project Settings
→ API

Use:

Project URL
Publishable key / anon key

DO NOT use the service_role / secret key here.
========================================================
*/


const SUPABASE_URL =
  "https://gjyeknwtoofpuvoaftfj.supabase.co";


const SUPABASE_ANON_KEY =
  "sb_publishable_HBf14rn-fWP8AZ_OaLFfag_V6qNKjk5";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/*
The ID of our single tracker row.
*/

const TRACKER_ID = 1;


/*
Supabase Storage bucket.
*/

const STORAGE_BUCKET =
  "tracker-images";



/*
========================================================
STATUS MESSAGE
========================================================
*/

function showStatus(message) {

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.classList.add("show");


  setTimeout(() => {

    status.classList.remove("show");

  }, 2500);

}



/*
========================================================
LOAD EVERYTHING
========================================================

This runs whenever the page opens.

Unlike localStorage, this data comes from
Supabase's online database.

Therefore every browser sees the same data.
========================================================
*/

async function loadSavedData() {

  showStatus("Loading...");


  try {

    const { data, error } =
      await supabaseClient

        .from("tracker")

        .select("*")

        .eq("id", TRACKER_ID)

        .single();


    if (error) {

      throw error;

    }


    /*
    ================================
    IMAGES
    ================================
    */

    for (let i = 1; i <= 3; i++) {

      const imageUrl =
        data["image" + i];


      if (imageUrl) {

        showImage(
          i,
          imageUrl
        );

      }

    }


    /*
    ================================
    CTR
    ================================
    */

    for (let i = 1; i <= 3; i++) {

      const value =
        data["ctr" + i];


      if (value !== null) {

        document.getElementById(
          "ctr" + i
        ).textContent = value;

      }

    }


    /*
    ================================
    RESULT
    ================================
    */

    for (let i = 1; i <= 3; i++) {

      const value =
        data["result" + i];


      if (value !== null) {

        document.getElementById(
          "result" + i
        ).textContent = value;

      }

    }


    showStatus("Loaded.");

  }

  catch (error) {

    console.error(error);

    showStatus(
      "Could not load data."
    );

    alert(
      "Could not connect to Supabase.\n\n" +
      "Check your Supabase URL and Publishable Key."
    );

  }

}



/*
========================================================
UPLOAD IMAGE
========================================================

Image goes:

Browser
   ↓
Supabase Storage
   ↓
Public image URL

Then the URL is saved in the database.
========================================================
*/

async function uploadImage(row, file) {

  if (!file) return;


  /*
  Prevent extremely large files.
  */

  if (file.size > 10 * 1024 * 1024) {

    alert(
      "Image is too large.\n\n" +
      "Please choose an image under 10 MB."
    );

    return;

  }


  const button =
    document.getElementById(
      "browse" + row
    );


  button.disabled = true;

  button.textContent =
    "uploading...";


  showStatus(
    "Uploading image..."
  );


  try {


    /*
    ============================================
    CREATE UNIQUE FILE NAME
    ============================================
    */

    const extension =
      file.name
        .split(".")
        .pop()
        .toLowerCase();


    const fileName =
      `row-${row}-${Date.now()}-${Math.random()
        .toString(36)
        .substring(2)}.${extension}`;


    /*
    ============================================
    UPLOAD TO SUPABASE STORAGE
    ============================================
    */

    const { error: uploadError } =

      await supabaseClient

        .storage

        .from(STORAGE_BUCKET)

        .upload(
          fileName,
          file,
          {
            cacheControl: "3600",
            upsert: false
          }
        );


    if (uploadError) {

      throw uploadError;

    }


    /*
    ============================================
    GET PUBLIC IMAGE URL
    ============================================
    */

    const { data: publicUrlData } =

      supabaseClient

        .storage

        .from(STORAGE_BUCKET)

        .getPublicUrl(fileName);


    const imageUrl =
      publicUrlData.publicUrl;


    /*
    ============================================
    SAVE URL TO DATABASE
    ============================================
    */

    const updateData = {};

    updateData["image" + row] =
      imageUrl;


    const { error: databaseError } =

      await supabaseClient

        .from("tracker")

        .update(updateData)

        .eq("id", TRACKER_ID);


    if (databaseError) {

      throw databaseError;

    }


    /*
    ============================================
    DISPLAY IMAGE
    ============================================
    */

    showImage(
      row,
      imageUrl
    );


    showStatus(
      "Image uploaded successfully."
    );


  }

  catch (error) {

    console.error(error);

    showStatus(
      "Upload failed."
    );


    alert(
      "Upload failed.\n\n" +
      error.message
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      "browse";

  }

}



/*
========================================================
DISPLAY IMAGE
========================================================
*/

function showImage(
  row,
  imageUrl
) {

  const img =
    document.getElementById(
      "image" + row
    );


  const placeholder =
    document.getElementById(
      "placeholder" + row
    );


  img.src =
    imageUrl;


  img.style.display =
    "block";


  placeholder.style.display =
    "none";

}



/*
========================================================
EDIT CTR / RESULT
========================================================

When user changes a number:

Browser
   ↓
Supabase database

So the new value is immediately available
from other browsers.
========================================================
*/

async function editNumber(id) {


  const element =
    document.getElementById(id);


  const currentValue =
    element.textContent;


  const newValue =
    prompt(
      "Enter new value:",
      currentValue
    );


  if (newValue === null) {

    return;

  }


  const cleanValue =
    newValue.trim();


  if (cleanValue === "") {

    return;

  }


  /*
  Show new value immediately.
  */

  element.textContent =
    cleanValue;


  /*
  Save to Supabase.
  */

  const updateData = {};

  updateData[id] =
    cleanValue;


  showStatus(
    "Saving..."
  );


  try {

    const { error } =

      await supabaseClient

        .from("tracker")

        .update(updateData)

        .eq("id", TRACKER_ID);


    if (error) {

      throw error;

    }


    showStatus(
      "Saved."
    );

  }

  catch (error) {

    console.error(error);


    showStatus(
      "Save failed."
    );


    alert(
      "Could not save to Supabase.\n\n" +
      error.message
    );

  }

}



/*
========================================================
START
========================================================
*/

loadSavedData();


</script>


</body>

</html>
